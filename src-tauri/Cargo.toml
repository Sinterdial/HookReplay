[package]
name = "hook-replay"
version = "1.2.0"
description = "HookReplay - 通用轻量 HTTP / Webhook 批量回放与调试桌面工作台"
authors = ["Sinterdial"]
license = "Apache-2.0"
repository = "https://github.com/Sinterdial/HookReplay"
edition = "2021"

[lib]
name = "hook_replay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
# 强制使用 Windows 原生 SChannel (native-tls)，避免 aws-lc-sys 需要额外安装 CMake/NASM
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip"] }
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
